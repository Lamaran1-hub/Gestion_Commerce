<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pas de connexion</title>
<link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
<style>
    :root { --fond: #F4F6F5; --texte: #1C2622; --doux: #5E6B65; --carte: #fff; }
    @media (prefers-color-scheme: dark) { :root { --fond: #121816; --texte: #E6ECE9; --doux: #9AA8A1; --carte: #1B2320; } }
    body { background: var(--fond); color: var(--texte); min-height: 100vh; display: grid; place-items: center; padding: 16px; font-family: system-ui, sans-serif; }
    .carte { background: var(--carte); border-radius: 12px; padding: 32px; max-width: 460px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .doux { color: var(--doux); }
    .icone { font-size: 3rem; color: #B7791F; }
</style>
</head>
<body>
    <div class="carte">
        <div class="icone"><i class="bi bi-wifi-off"></i></div>
        <h1 class="h4 mt-2">Pas de connexion internet</h1>
        <p class="doux">Cette page a besoin du réseau. <strong>La caisse, elle, continue de fonctionner</strong> : les ventes sont gardées sur cet appareil et envoyées automatiquement au retour de la connexion.</p>
        <a href="/caisse" class="btn btn-success btn-lg"><i class="bi bi-cart-plus me-1"></i>Ouvrir la caisse</a>
        <p class="small doux mt-3 mb-0">La caisse doit avoir été ouverte au moins une fois avec connexion sur cet appareil.</p>
        <button type="button" class="btn btn-link mt-2" onclick="location.reload()">Réessayer</button>
    </div>
</body>
</html>
